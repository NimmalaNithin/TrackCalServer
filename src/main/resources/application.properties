spring.application.name=TrackCalServer
spring.config.import=optional:file:.env[.properties]

jwt.expiration=86400000

app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173
app.frontend-url=http://localhost:5173
app.registration-otp.expiration-minutes=10
app.registration-otp.resend-cooldown-seconds=60

google.client-id=877656468545-gs0q7up22pnpaa8o9lh8hlgsg5hm683m.apps.googleusercontent.com
google.redirect-uri=http://localhost:8080/api/auth/google/callback

spring.mail.host=smtp.gmail.com
