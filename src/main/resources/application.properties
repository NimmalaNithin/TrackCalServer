spring.application.name=TrackCalServer
spring.config.import=optional:file:.env[.properties]
server.port=${PORT:8080}
logging.level.org.springframework.data.mongodb.core.MongoTemplate=DEBUG
spring.mongodb.uri=${SPRING_MONGODB_URI:mongodb://localhost:27017/trackcal}

jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION:86400000}

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
app.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}

app.registration-otp.expiration-minutes=10
app.registration-otp.resend-cooldown-seconds=60
app.email.provider=${APP_EMAIL_PROVIDER:smtp}
app.email.from=${MAIL_FROM:}
app.email.resend.api-key=${RESEND_API_KEY:}
app.email.brevo.api-key=${BREVO_API_KEY:}
app.email.brevo.from-email=${BREVO_MAIL_FROM_EMAIL:}
app.email.brevo.from-name=${BREVO_MAIL_FROM_NAME:Track Cal}

google.client-id=${GOOGLE_CLIENT_ID:}
google.client-secret=${GOOGLE_CLIENT_SECRET:}
google.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:8080/api/auth/google/callback}

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
